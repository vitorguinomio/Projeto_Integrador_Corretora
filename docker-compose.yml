version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: corretora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: corretora_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - corretora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corretora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corretora-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/corretora_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - corretora-network

volumes:
  postgres_data:
    driver: local

networks:
  corretora-network:
    driver: bridge
